<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Cascade Agent</title>
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --line:#e3e1dc; --bg:#f7f6f3; --card:#fff;
          --accent:#e8943a; --accent-bg:#fdf1e3; --warn:#b3261e; --flag-line:#e6c200; --flag-bg:#fffbe0; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  button { font:inherit; border:1px solid var(--line); background:var(--card); border-radius:7px; padding:5px 12px; cursor:pointer; }
  button:hover { border-color:var(--ink); }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button:disabled { opacity:.5; cursor:default; }

  /* top: title, tabs and the event facts window stay in view */
  .top { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); box-shadow:0 2px 8px rgba(0,0,0,.05); }
  header { padding:14px 24px 0; display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  #event-pick { font:inherit; font-size:20px; font-weight:700; border:1px solid var(--line); border-radius:7px; padding:3px 8px; background:var(--card); max-width:60vw; }
  #new-event { display:flex; gap:8px; padding:10px 24px 0; flex-wrap:wrap; align-items:center; }
  #new-event input, #new-event select { width:auto; margin:0; flex:1; min-width:180px; max-width:340px; }
  header .sub { color:var(--muted); flex:1; min-width:200px; }
  nav { display:flex; gap:4px; padding:10px 24px 0; }
  nav a { padding:7px 14px; border:1px solid var(--line); border-bottom:0; border-radius:8px 8px 0 0; color:var(--muted); text-decoration:none; background:var(--bg); }
  nav a.on { color:var(--ink); background:var(--card); font-weight:600; position:relative; top:1px; }
  #roles { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding-bottom:6px; }
  #roles .lbl { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  #roles button { padding:2px 10px; border-radius:14px; font-size:13.5px; }
  #roles button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  select.owner { font:inherit; font-size:13px; width:auto; margin:0; padding:1px 4px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  .count { background:var(--flag-line); color:var(--ink); border-radius:10px; padding:0 7px; font-size:12px; font-weight:600; margin-left:4px; }
  #facts-window { padding:12px 24px 14px; border-top:1px solid var(--line); max-height:42vh; overflow:auto; }
  #facts-window h2 { margin-bottom:8px; }
  .group { display:grid; grid-template-columns:110px 1fr; gap:8px; align-items:start; margin-top:6px; }
  .group > .name { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding-top:7px; }
  .group > .cells { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:6px 8px; }
  @media (max-width:800px) { .group { grid-template-columns:1fr; } }
  .fact { border:1px solid var(--line); border-radius:7px; padding:5px 9px; min-width:0; }
  .fact .k { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .fact .v { font-weight:600; overflow-wrap:anywhere; }
  .fact .was { font-size:12px; color:var(--muted); }
  .fact { cursor:pointer; }
  .fact:hover { border-color:var(--ink); }
  .fact input { font:inherit; font-weight:600; width:100%; border:1px solid var(--ink); border-radius:5px; padding:1px 5px; margin:0; }
  .pick { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .reason .more { color:var(--muted); border-bottom:1px dotted var(--muted); cursor:help; white-space:nowrap; }
  .related { display:none; margin:6px 0 0; padding:8px 10px 8px 26px; background:var(--card); border:1px solid var(--line); border-radius:6px; font-size:13px; }
  .card:hover .related { display:block; }
  .pick label.sel { display:flex; gap:8px; align-items:center; cursor:pointer; }
  .card label.sel { display:flex; gap:8px; align-items:center; cursor:pointer; }
  .fact.unknown .v { font-weight:400; color:var(--muted); }
  .fact.changed { border-color:var(--flag-line); background:var(--flag-bg); }
  .fact.pending { border-color:var(--accent); background:var(--accent-bg); }
  @media (max-width:800px) { .top { position:static; } #facts-window { max-height:none; } }

  main { padding:16px 24px 40px; }
  .stack { display:grid; gap:16px; }
  #incoming { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px; }
  .item { border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:4px; min-width:0; }
  .item .t { font-weight:600; overflow-wrap:anywhere; }
  .item button { margin-top:auto; align-self:flex-start; }
  .item.more { align-items:center; justify-content:center; border-style:dashed; cursor:pointer; color:var(--muted); background:none; font:inherit; }
  #incoming-count { text-transform:none; letter-spacing:0; font-weight:400; }
  .cols { display:grid; grid-template-columns:minmax(260px,1fr) minmax(360px,2fr); gap:16px; align-items:start; }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
  [hidden] { display:none !important; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  h3 { font-size:14px; margin:18px 0 8px; }
  .row { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .grow { flex:1; min-width:0; }
  .muted { color:var(--muted); font-size:13px; }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:.05em; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--muted); white-space:nowrap; background:var(--card); }
  .card { border:1px solid var(--accent); background:var(--accent-bg); border-radius:8px; padding:12px; margin-bottom:10px; }
  .card.recheck { border-color:var(--flag-line); background:var(--flag-bg); }
  .change { font-size:17px; font-weight:600; margin:2px 0 6px; }
  .change s { color:var(--muted); font-weight:400; }
  blockquote { margin:6px 0; padding-left:10px; border-left:3px solid var(--accent); color:#444; font-size:13.5px; }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .reason { font-size:13.5px; margin:6px 0 0; white-space:pre-line; }
  textarea, select, input[type=text] { font:inherit; width:100%; border:1px solid var(--line); border-radius:7px; padding:7px; margin-bottom:8px; }
  textarea { min-height:90px; resize:vertical; }
  details.history { border-top:1px solid var(--line); margin-top:14px; }
  details.history summary { color:var(--muted); margin:12px 0 4px; }
  .row.past { align-items:flex-start; }
  .row.past .reason { color:var(--muted); margin-top:2px; }
  details summary { cursor:pointer; font-weight:600; font-size:14px; margin:18px 0 8px; }
  .task.done .title { text-decoration:line-through; color:var(--muted); }
  .overdue { color:var(--warn); }
  .notice { background:#fdecea; border:1px solid var(--warn); color:var(--warn); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; display:none; max-width:80vw; z-index:9; }
  #toast.error { background:var(--warn); }
  .empty { color:var(--muted); padding:6px 0; }
</style>
</head>
<body>
<div class="top">
  <header>
    <select id="event-pick" title="Switch event"></select>
    <button id="new-event-btn">New event</button>
    <span class="sub" id="event-sub">One change in, every dependent task updated.</span>
    <button id="reset">Reset this event</button>
  </header>
  <form id="new-event" hidden>
    <input type="text" id="new-name" placeholder="Event name">
    <select id="new-type"></select>
    <button class="primary" type="submit">Create event</button>
    <button type="button" id="new-cancel">Cancel</button>
  </form>
  <nav>
    <a href="#updates" data-tab="updates">Updates</a>
    <a href="#template" data-tab="template">Template <span id="template-count"></span></a>
    <div id="roles"></div>
  </nav>
  <div id="facts-window">
    <h2>Event facts <span style="text-transform:none; letter-spacing:0; font-weight:400">· click a value to change it, or empty it to leave it blank</span></h2>
    <div id="board"></div>
  </div>
</div>

<main>
  <div id="notice"></div>

  <div id="view-updates" class="stack">
    <section>
      <h2>Incoming <span id="incoming-count"></span></h2>
      <div id="incoming"></div>
      <details id="paste-box">
        <summary>Paste something else</summary>
        <select id="kind"><option value="email">Email</option><option value="transcript">Meeting transcript</option><option value="contract">Contract / quote</option><option value="web">Venue web page</option></select>
        <input type="text" id="sender" placeholder="From (optional)">
        <textarea id="text" placeholder="Paste the text here"></textarea>
        <button id="paste-btn" class="primary">Read it</button>
      </details>
      <div id="already"></div>
    </section>

    <section>
      <h2>Changes and affected tasks</h2>
      <div id="proposals"></div>
      <div id="affected"></div>
      <div id="completed"></div>
    </section>
  </div>

  <div id="view-template" hidden>
    <section>
      <h2>Template checklist</h2>
      <div id="tasks"></div>
      <div id="set-aside"></div>
    </section>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
let S = null, current = null;         // current = id of the event being shown
try { current = localStorage.getItem("event"); } catch {}
const openSections = new Set();      // expandable sections the user has opened
const INCOMING_SHOWN = 5;            // items shown before the "+ more" card
let showAllIncoming = false;
let roleFilter = null;               // show only this role's tasks (null = everyone)
const pickedTasks = new Set();       // tasks to re-check the user has ticked
const unpicked = new Set();          // proposed changes the user has unticked

function toast(msg, error) {
  const t = $("toast"); t.textContent = msg; t.className = error ? "error" : ""; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", error ? 8000 : 4000);
}

async function api(path, body) {
  path += (path.includes("?") ? "&" : "?") + "event=" + (current || "");
  const res = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const data = await res.json();
  if (data.error) { toast(data.error, true); return null; }
  S = data; current = S.event.id;
  try { localStorage.setItem("event", current); } catch {}
  render(); return data;
}

function showTab() {
  const tab = location.hash === "#template" ? "template" : "updates";
  $("view-updates").hidden = tab !== "updates";
  $("view-template").hidden = tab !== "template";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}
window.addEventListener("hashchange", showTab);

// One look for a task that needs a re-check, used on both tabs.
// The "Check against: ..." facts are tucked away and shown when the mouse is over the card.
function recheckCard(t) {
  const lines = (t.flag_reason || "").split("\n").map(line => {
    const [main, related] = line.split(". Check against: ");
    return `<p class="reason">${esc(main)}${related ? `<span class="more"> · related facts</span>` : ""}</p>`
      + (related ? `<ul class="related">${related.split("; ").map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : "");
  }).join("");
  return `<div class="card recheck">
      <label class="sel"><input type="checkbox" data-picktask="${t.id}" ${pickedTasks.has(t.id) ? "checked" : ""}>
        <strong>${esc(t.title)}</strong> <span class="tag">${t.template_id ? "Re-check" : "Added"}</span></label>
      <div class="muted">${ownerSelect(t)}${t.due_display ? " · due " + esc(t.due_display) : ""}</div>
      ${lines}
    </div>`;
}

// Who is responsible for a task, changeable in place.
function ownerSelect(t) {
  const roles = S.roles.includes(t.owner_role) || !t.owner_role ? S.roles : [...S.roles, t.owner_role];
  return `<select class="owner" data-owner="${t.id}" title="Who is responsible">${t.owner_role ? "" : '<option value="">Unassigned</option>'}`
    + roles.map(r => `<option ${r === t.owner_role ? "selected" : ""}>${esc(r)}</option>`).join("") + "</select>";
}

// Tick tasks, then close them together.
function taskBar(flagged) {
  if (!flagged.length) return "";
  const n = flagged.filter(t => pickedTasks.has(t.id)).length;
  return `<div class="pick"><label class="sel"><input type="checkbox" data-pickall ${n === flagged.length ? "checked" : ""}>
      <strong>${plural(flagged.length, "task")} to re-check</strong></label><span class="grow"></span>
    <button class="primary" data-bulk="resolve" ${n ? "" : "disabled"}>Mark checked as done (${n})</button>
    <button data-bulk="dismissed" ${n ? "" : "disabled"}>Not relevant</button></div>`;
}

function render() {
  const allFlagged = S.tasks.filter(t => t.status === "needs_recheck");
  if (roleFilter && !S.tasks.some(t => t.owner_role === roleFilter)) roleFilter = null;
  const mine = t => !roleFilter || t.owner_role === roleFilter;
  const flagged = allFlagged.filter(mine);
  // event-level view by role: open tasks and how many need a re-check; click to filter both tabs
  const open = S.tasks.filter(t => t.status === "ok" || t.status === "needs_recheck");
  const roleChip = (role, label) => {
    const n = open.filter(t => !role || t.owner_role === role), r = n.filter(t => t.status === "needs_recheck").length;
    return `<button data-role="${esc(role || "")}" class="${(roleFilter || "") === (role || "") ? "on" : ""}" title="${n.length} open, ${r} to re-check">${esc(label)} ${n.length}${r ? ` <span class="count">${r}</span>` : ""}</button>`;
  };
  $("roles").innerHTML = '<span class="lbl">Responsible</span>' + roleChip(null, "Everyone")
    + [...new Set(S.tasks.map(t => t.owner_role).filter(Boolean))].sort().map(r => roleChip(r, r)).join("");
  const known = S.board.filter(f => f.display).length;
  $("event-pick").innerHTML = S.events.map(ev => `<option value="${ev.id}" ${ev.id === S.event.id ? "selected" : ""}>${esc(ev.name)}</option>`).join("");
  $("new-type").innerHTML = S.event_types.map(t => `<option>${esc(t)}</option>`).join("");
  document.title = S.event.name;
  $("event-sub").textContent = `${S.event.type} · ${known} of ${S.board.length} facts known · ${plural(allFlagged.length, "task")} to re-check`;
  $("template-count").innerHTML = allFlagged.length ? `<span class="count">${allFlagged.length}</span>` : "";
  $("notice").innerHTML = S.notice ? `<div class="notice">${esc(S.notice)}</div>` : "";

  const groups = [...new Set(S.board.map(f => f.group))];
  $("board").innerHTML = groups.map(g => `<div class="group"><div class="name">${esc(g)}</div><div class="cells">` + S.board.filter(f => f.group === g).map(f => `
    <div class="fact ${f.pending ? "pending" : f.was ? "changed" : ""} ${f.display ? "" : "unknown"}" data-key="${esc(f.key)}" data-edit="${esc(f.edit)}" title="${esc(f.display ? `${f.source || ""}${f.quote ? ': "' + f.quote + '"' : ""}` : "")}">
      <div class="k">${esc(f.label)}</div>
      <div class="v">${esc(f.display || "—")}</div>
      ${f.pending ? '<div class="was">change waiting for approval</div>' : f.was ? `<div class="was">was ${esc(f.was)}</div>` : ""}
    </div>`).join("") + "</div></div>").join("");

  const sampleRow = s => `<div class="row"><div class="grow">${esc(s.title)}<div class="muted">${esc(s.kind)}${s.baseline ? " · starting information" : ""}</div></div>
    ${s.ingested ? '<span class="tag">read</span>' : `<button data-sample="${esc(s.file)}">Read</button>`}</div>`;
  const waiting = S.samples.filter(s => !s.ingested), read = S.samples.filter(s => s.ingested);
  // Incoming queue: oldest first, the first few shown; reading one moves the next up
  const item = s => `<div class="item"><span class="tag" style="align-self:flex-start">${esc(s.kind)}</span>
      <div class="t">${esc(s.title.replace(/^[^-]+ - /, ""))}</div>
      <div class="muted">${esc([s.sender, s.received].filter(Boolean).join(" · "))}</div>
      <button class="primary" data-sample="${esc(s.file)}">Read</button></div>`;
  const visible = showAllIncoming ? waiting : waiting.slice(0, INCOMING_SHOWN), hiddenCount = waiting.length - visible.length;
  $("incoming-count").textContent = waiting.length ? `· ${waiting.length} waiting` : "";
  $("incoming").innerHTML = (visible.map(item).join("")
      + (hiddenCount ? `<button class="item more" id="incoming-more">+ ${hiddenCount} more</button>` : "")
      + (showAllIncoming && waiting.length > INCOMING_SHOWN ? '<button class="item more" id="incoming-less">Show fewer</button>' : ""))
    || `<div class="empty">${S.samples.length ? "Nothing waiting. New emails, transcripts and contracts will appear here." : "Paste an email, transcript or contract below."}</div>`;
  if (!S.samples.length) $("paste-box").open = true;
  $("already").innerHTML = read.length ? `<details class="history" data-section="read" ${openSections.has("read") ? "open" : ""}>
      <summary>Already read (${read.length})</summary><div>${read.map(sampleRow).join("")}</div></details>` : "";

  const ids = S.proposals.map(p => p.id);
  [...unpicked].forEach(id => ids.includes(id) || unpicked.delete(id));
  const picked = ids.filter(id => !unpicked.has(id));
  $("proposals").innerHTML = (S.proposals.length ? `
    <div class="pick"><strong>${plural(S.proposals.length, "change")} waiting for approval</strong><span class="grow"></span>
      <button class="primary" id="approve-picked" ${picked.length ? "" : "disabled"}>Approve checked (${picked.length})</button>
      <button id="reject-picked" ${picked.length ? "" : "disabled"}>Ignore checked</button></div>` : "")
    + S.proposals.map(p => `
    <div class="card">
      <label class="sel"><input type="checkbox" data-pick="${p.id}" ${unpicked.has(p.id) ? "" : "checked"}>
        <span class="change" style="margin:0">${esc(p.label)}: ${p.old_display ? `<s>${esc(p.old_display)}</s> → ` : ""}${esc(p.display)}</span></label>
      ${p.quote ? `<blockquote>“${esc(p.quote)}”</blockquote>` : ""}
      <div class="muted">${esc([p.source_kind, p.source_sender].filter(Boolean).join(" from "))}${p.confidence != null && p.confidence < 0.7 ? " · the agent is not sure about this one" : ""}
        · ${plural(p.affects, "task")} depend${p.affects === 1 ? "s" : ""} on this</div>
      ${p.old_backing ? `<div class="muted">${plural(p.old_backing, "source")} so far said ${esc(p.old_display)}; ${p.new_backing} now say${p.new_backing === 1 ? "s" : ""} ${esc(p.display)}. Check this is a real change and not a typo.</div>` : ""}
    </div>`).join("");
  [...pickedTasks].forEach(id => flagged.some(t => t.id === id) || pickedTasks.delete(id));
  $("affected").innerHTML = taskBar(flagged) + flagged.map(recheckCard).join("")
    || (S.proposals.length ? "" : '<div class="empty">Nothing needs attention. Read an incoming item to see what it changes.</div>');

  // Completed: re-checks and added tasks that were dealt with, plus changes already decided
  const outcome = t => t.status === "dismissed" ? "Not relevant" : t.template_id ? "Checked" : "Handled";
  const pastRow = t => `<div class="row past"><span class="tag">${outcome(t)}</span>
      <div class="grow">${esc(t.title)}<p class="reason">${esc(t.flag_reason || "")}</p></div>
      <button data-task="${t.id}" data-status="needs_recheck">Reopen</button></div>`;
  const resolved = S.tasks.filter(t => t.flag_reason && t.status !== "needs_recheck" && mine(t));
  const history = (id, title, body) => body ? `<details class="history" data-section="${id}" ${openSections.has(id) ? "open" : ""}><summary>${title}</summary><div>${body}</div></details>` : "";
  $("completed").innerHTML =
    history("done", `Completed (${resolved.length})`, resolved.map(pastRow).join(""))
    + history("decided", `Changes decided (${S.decided.length})`, S.decided.map(d => `<div class="row past"><span class="tag">${d.outcome}</span>
      <div class="grow">${esc(d.label)}: ${esc(d.display)}<div class="muted">${esc(d.source)}</div></div></div>`).join(""));
  const dismissed = S.tasks.filter(t => t.status === "dismissed" && mine(t));
  $("set-aside").innerHTML = history("dismissed", `Marked not relevant (${dismissed.length})`, dismissed.map(pastRow).join(""));

  // Template tab: the whole checklist, with the same highlight on tasks to re-check
  const shown = S.tasks.filter(t => t.status !== "dismissed" && mine(t));
  const stageOf = t => t.template_id ? (t.stage || "Other") : "Added for this event";
  const stages = [...new Set(shown.map(stageOf))].sort((a, b) => (b === "Added for this event") - (a === "Added for this event"));
  $("tasks").innerHTML = taskBar(flagged) + stages.map(stage => `<h3>${esc(stage)}</h3><div>` + shown.filter(t => stageOf(t) === stage).map(t =>
    t.status === "needs_recheck" ? recheckCard(t) : `
    <label class="row task ${t.status}"><input type="checkbox" data-task="${t.id}" data-status="${t.status === "done" ? "ok" : "done"}" ${t.status === "done" ? "checked" : ""}>
      <span class="grow title">${esc(t.title)}</span>
      ${ownerSelect(t)}
      <span class="muted ${t.status === "ok" && t.due_date && t.due_date < S.today ? "overdue" : ""}">${esc(t.due_display)}</span></label>`).join("") + "</div>").join("");
}

function summarize(r) {
  if (!r) return "Done";
  if (r.closed) return `${plural(r.closed, "task")} moved to Completed`;
  const parts = [];
  if (!(r.new || r.proposed) && !r.flagged?.length && !r.added?.length) return "No tasks affected";
  if (r.new?.length) parts.push(plural(r.new.length, "new fact"));
  if (r.proposed?.length) parts.push(`${plural(r.proposed.length, "change")} waiting for approval`);
  if (r.flagged?.length) parts.push(`${plural(r.flagged.length, "task")} to re-check`);
  if (r.added?.length) parts.push(`${plural(r.added.length, "task")} added`);
  return parts.join(", ") || "Nothing new in that one";
}

async function withBusy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label;
  try { const d = await fn(); if (d) toast(summarize(d.result)); }
  finally { btn.disabled = false; btn.textContent = old; }
}

document.addEventListener("click", e => {
  const cell = e.target.closest(".fact");
  if (cell && !cell.querySelector("input")) return editFact(cell);
  if (e.target.closest("select.owner")) return;     // choosing an owner must not tick the task's checkbox
  const b = e.target.closest("button, input[type=checkbox]"); if (!b) return;
  if (b.dataset.picktask) { b.checked ? pickedTasks.add(+b.dataset.picktask) : pickedTasks.delete(+b.dataset.picktask); return render(); }
  if ("pickall" in b.dataset) {
    S.tasks.filter(t => t.status === "needs_recheck" && (!roleFilter || t.owner_role === roleFilter)).forEach(t => b.checked ? pickedTasks.add(t.id) : pickedTasks.delete(t.id));
    return render();
  }
  if (b.id === "incoming-more" || b.id === "incoming-less") { showAllIncoming = b.id === "incoming-more"; return render(); }
  if ("role" in b.dataset) { roleFilter = b.dataset.role || null; pickedTasks.clear(); return render(); }
  if (b.dataset.bulk) return withBusy(b, "Working…", () => api("/api/tasks/status", {ids: [...pickedTasks], status: b.dataset.bulk}));
  if (b.dataset.pick) { b.checked ? unpicked.delete(+b.dataset.pick) : unpicked.add(+b.dataset.pick); return render(); }
  if (b.id === "approve-picked" || b.id === "reject-picked") {
    const ids = S.proposals.map(p => p.id).filter(id => !unpicked.has(id));
    return withBusy(b, "Working…", () => api(`/api/facts/${b.id === "approve-picked" ? "approve" : "reject"}`, {ids}));
  }
  if (b.dataset.sample) withBusy(b, "Reading…", () => api("/api/ingest", {sample: b.dataset.sample}));
  else if (b.dataset.task) api(`/api/tasks/${b.dataset.task}/status`, {status: b.dataset.status});
  else if (b.id === "paste-btn") withBusy(b, "Reading…", async () => {
    const d = await api("/api/ingest", {kind: $("kind").value, sender: $("sender").value, text: $("text").value});
    if (d) $("text").value = ""; return d; });
  else if (b.id === "reset" && confirm(`Clear all sources, facts and task progress for "${S.event.name}"?`)) api("/api/reset", {});
});

// Click a fact to type a new value. Enter saves it to the database; Esc cancels.
function editFact(cell) {
  const v = cell.querySelector(".v"), input = document.createElement("input");
  input.type = "text"; input.value = cell.dataset.edit;
  v.replaceWith(input); input.focus(); input.select();
  let finished = false;
  const finish = async save => {
    if (finished) return; finished = true;
    const value = input.value.trim();
    if (save && value !== cell.dataset.edit) {        // an empty box clears the fact
      const d = await api("/api/facts/set", {key: cell.dataset.key, value});
      if (d) return toast(value ? "Saved. " + summarize(d.result) : "Cleared");
    }
    render();
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
  input.addEventListener("blur", () => finish(false));
}

document.addEventListener("change", async e => {    // reassign a task from its drop-down
  const sel = e.target.closest("select.owner"); if (!sel) return;
  const d = await api(`/api/tasks/${sel.dataset.owner}/owner`, {owner: sel.value});
  if (d) toast(`Reassigned to ${sel.value}`);
});
document.addEventListener("toggle", e => {          // remember which sections are open across refreshes
  const id = e.target.dataset?.section; if (!id) return;
  e.target.open ? openSections.add(id) : openSections.delete(id);
}, true);
$("event-pick").addEventListener("change", e => { current = e.target.value; unpicked.clear(); api("/api/state"); });
$("new-event-btn").addEventListener("click", () => { $("new-event").hidden = false; $("new-name").focus(); });
$("new-cancel").addEventListener("click", () => { $("new-event").hidden = true; });
$("new-event").addEventListener("submit", async e => {
  e.preventDefault();
  const d = await api("/api/events", {name: $("new-name").value, type: $("new-type").value});
  if (d) { $("new-event").hidden = true; $("new-name").value = ""; toast(`Created with ${plural(S.tasks.length, "task")} from the ${S.event.type} template`); }
});

showTab();
api("/api/state");
</script>
</body>
